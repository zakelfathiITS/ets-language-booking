name: Backend

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    name: Quality gates & tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mongodb, intl, apcu
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: backend

      - name: Generate JWT key pair
        run: bin/console lexik:jwt:generate-keypair --skip-if-exists

      - name: Coding standards
        run: composer cs:check

      - name: Static analysis
        run: composer stan

      - name: Architecture rules
        run: composer deptrac

      - name: Tests (with coverage)
        shell: bash
        run: |
          vendor/bin/phpunit --colors=never --coverage-html var/coverage \
            --coverage-text=var/coverage.txt --only-summary-for-coverage-text
          cat var/coverage.txt
          {
            echo "### Backend coverage"
            echo '```'
            grep -E "Classes:|Methods:|Lines:" var/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/var/coverage
          retention-days: 14
