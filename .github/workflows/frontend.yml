name: Frontend

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend.yml']

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    name: Lint, type check, tests & build
    runs-on: ubuntu-latest

    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (including architecture boundaries)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unused code and dependencies
        run: npm run knip

      - name: Tests (with coverage)
        shell: bash
        run: |
          npm run -s test:coverage -- --coverageReporters=text-summary --coverageReporters=html | tee coverage-summary.txt
          {
            echo "### Frontend coverage"
            echo '```'
            grep -E "Statements|Branches|Functions|Lines" coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 14

      - name: Production build
        run: npm run build
