name: Security

on:
  push:
    branches: [main]
  pull_request:
  # Weekly: new advisories are published without any change to this repository.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan every commit with gitleaks
        run: >
          docker run --rm -v "$PWD":/repo -w /repo zricethezav/gitleaks:v8.30.1
          git --no-banner --redact --config .gitleaks.toml .

  dependencies:
    name: Dependency audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Audit PHP dependencies (composer.lock)
        working-directory: backend
        run: composer audit --locked --no-interaction

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Audit JavaScript dependencies (package-lock.json)
        working-directory: frontend
        run: npm audit --audit-level=high
