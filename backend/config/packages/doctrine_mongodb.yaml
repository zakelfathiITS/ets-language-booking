doctrine_mongodb:
    auto_generate_proxy_classes: true
    auto_generate_hydrator_classes: true
    connections:
        default:
            server: '%env(MONGODB_URI)%'
            options: {}
    default_database: '%env(MONGODB_DB)%'
    document_managers:
        default:
            auto_mapping: false
            # Domain classes carry no persistence metadata: their mapping lives in
            # XML files inside the infrastructure layer, one directory per bounded context.
            mappings:
                Identity:
                    type: xml
                    is_bundle: false
                    dir: '%kernel.project_dir%/src/Infrastructure/Persistence/MongoDB/Mapping/Identity'
                    prefix: 'App\Domain\Identity'
                Catalog:
                    type: xml
                    is_bundle: false
                    dir: '%kernel.project_dir%/src/Infrastructure/Persistence/MongoDB/Mapping/Catalog'
                    prefix: 'App\Domain\Catalog'
                Booking:
                    type: xml
                    is_bundle: false
                    dir: '%kernel.project_dir%/src/Infrastructure/Persistence/MongoDB/Mapping/Booking'
                    prefix: 'App\Domain\Booking'

when@prod:
    doctrine_mongodb:
        auto_generate_proxy_classes: false
        auto_generate_hydrator_classes: false
        document_managers:
            default:
                metadata_cache_driver:
                    type: service
                    id: doctrine_mongodb.system_cache_pool

    framework:
        cache:
            pools:
                doctrine_mongodb.system_cache_pool:
                    adapter: cache.system
