# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    annotations: false
    http_method_override: false
    handle_all_throwables: true

    # Stateless REST API: the caller's identity travels in the JWT, never in a session.
    session: false

    php_errors:
        log: true

    # Business errors are expected outcomes, not incidents: log them quietly.
    # Status codes are chosen by ApiProblemListener (setting "status_code" here
    # would wrap the exception and hide its specific error code).
    exceptions:
        App\Domain\Shared\Exception\NotFoundException:
            log_level: info
        App\Domain\Shared\Exception\ConflictException:
            log_level: info
        App\Domain\Shared\Exception\InvariantViolationException:
            log_level: info

when@test:
    framework:
        test: true
