security:
    password_hashers:
        App\Infrastructure\Security\SecurityUser: 'auto'

    providers:
        # Login form: users are looked up by email.
        users_by_email:
            id: App\Infrastructure\Security\UserByEmailProvider
        # JWT: users are looked up by the id stored in the "sub" claim.
        users_by_id:
            id: App\Infrastructure\Security\UserByIdProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # POST /api/auth/login exchanges {"email", "password"} for a JWT.
        login:
            pattern: ^/api/auth/login$
            stateless: true
            provider: users_by_email
            json_login:
                check_path: api_auth_login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            # Failed attempts are limited per client, per account and per both
            # (see LoginRateLimiter and config/packages/rate_limiter.yaml).
            login_throttling:
                limiter: App\Infrastructure\Security\LoginRateLimiter

        # POST /api/auth/logout revokes the token and clears its cookie. No
        # authenticator here: signing out works even with an expired token.
        logout:
            pattern: ^/api/auth/logout$
            stateless: true
            logout:
                path: api_auth_logout
                invalidate_session: false
                delete_cookies:
                    ets_token: { path: /api }

        # Every other API route authenticates with "Authorization: Bearer <token>".
        api:
            pattern: ^/api
            stateless: true
            provider: users_by_id
            jwt: ~

    access_control:
        - { path: ^/api/health$, roles: PUBLIC_ACCESS }
        - { path: ^/api/doc(\.json)?$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/(register|login|logout)$, roles: PUBLIC_ACCESS }
        # The catalogue is managed by administrators only (also enforced with #[IsGranted]).
        - { path: ^/api/sessions, methods: [POST, PUT, PATCH, DELETE], roles: ROLE_ADMIN }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Hashing is deliberately slow in production; tests do not need that.
            App\Infrastructure\Security\SecurityUser:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
