parameters:
    # Timezone in which session dates and times are entered and displayed.
    app.timezone: '%env(APP_TIMEZONE)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Every class under src/ is a service. Ports (interfaces) are bound to their
    # single adapter automatically, e.g. UserRepository -> MongoUserRepository.
    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
