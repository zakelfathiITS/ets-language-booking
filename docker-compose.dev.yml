# Development overrides: bind-mounted sources, debug mode and hot reload.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
services:
  mongodb:
    ports:
      - "${MONGO_PORT:-27017}:27017"

  backend:
    build:
      target: dev
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
    volumes:
      - ./backend:/app
      # Keep dependencies and cache inside the container (faster than a WSL/macOS bind mount).
      - backend_vendor:/app/vendor
      - backend_var:/app/var

  frontend:
    build:
      target: dev
    environment:
      # File-change events do not cross WSL/VM bind mounts reliably.
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

volumes:
  backend_vendor:
  backend_var:
  frontend_node_modules:
  frontend_next:
