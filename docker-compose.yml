# Production-like stack: `docker compose up -d --build` is all a reviewer needs.
# For hot reload during development, see docker-compose.dev.yml (`make dev`).
name: ets-language-booking

services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-ets}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-ets_local_password}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      APP_SECRET: ${APP_SECRET:-local_only_change_me_in_production}
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-ets}:${MONGO_ROOT_PASSWORD:-ets_local_password}@mongodb:27017/?authSource=admin&serverSelectionTimeoutMS=3000
      MONGODB_DB: ${MONGODB_DB:-ets_booking}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-local_only_jwt_passphrase_change_me}
      # This local stack is served over plain HTTP: the token cookie cannot require HTTPS.
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-0}
      API_PROXY_SECRET: ${API_PROXY_SECRET:-local_only_proxy_secret_change_me}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Paris}
      # Loads demo accounts and sessions on first start (idempotent).
      APP_SEED_DEMO_DATA: ${APP_SEED_DEMO_DATA:-1}
    volumes:
      # Keeps the JWT key pair across restarts, so issued tokens stay valid.
      - jwt_keys:/app/config/jwt
    ports:
      - "${BACKEND_PORT:-8000}:80"

  frontend:
    build:
      context: ./frontend
      target: runner
      args:
        NEXT_PUBLIC_SHOW_DEMO_ACCOUNTS: ${NEXT_PUBLIC_SHOW_DEMO_ACCOUNTS:-true}
        # Same timezone as the API (display hint of the back-office form).
        NEXT_PUBLIC_APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Paris}
    restart: unless-stopped
    environment:
      # The browser only talks to this origin: /api/* is forwarded to the API.
      API_INTERNAL_URL: http://backend
      API_PROXY_SECRET: ${API_PROXY_SECRET:-local_only_proxy_secret_change_me}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  mongo_data:
  jwt_keys:
